# Render Blueprint for Inventory Management System
# This file defines your infrastructure as code
# Place this in your repository root and Render will auto-detect it

services:
  # PostgreSQL Database
  - type: pserv
    name: inventory-db
    plan: starter # Change to 'free' for free tier (90 days)
    region: oregon # Change to your preferred region: oregon, frankfurt, singapore, ohio
    databaseName: inventory_db
    databaseUser: inventory_user
    # Password will be auto-generated

  # Spring Boot Web Service
  - type: web
    name: inventory-management-app
    runtime: docker # Using your Dockerfile
    region: oregon # Must match database region
    plan: starter # Change to 'free' for free tier (with cold starts)
    branch: main # Git branch to deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: inventory-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: inventory-db
          property: password
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -Xmx512m -Xms256m
    autoDeploy: true # Auto-deploy on git push


