# Production Configuration
# This file is used when SPRING_PROFILES_ACTIVE=prod

# Server
server.port=${PORT:8080}

# Database - using environment variables
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# JPA / Hibernate - Production settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Thymeleaf - Enable caching in production
spring.thymeleaf.cache=true

# SQL Initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Logging - Production level
logging.level.root=INFO
logging.level.com.inventory=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# Enable HiddenHttpMethodFilter
spring.mvc.hiddenmethod.filter.enabled=true

# Error handling
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security headers
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
