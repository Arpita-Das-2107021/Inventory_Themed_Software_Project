# Server
server.port=${PORT:8080}
server.error.whitelabel.enabled=false

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventory_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf
spring.thymeleaf.cache=false

# SQL Initialization (seed roles)
spring.sql.init.mode=always
# Defer data.sql until after Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

# Logging
logging.level.org.springframework.security=INFO

# Enable HiddenHttpMethodFilter for PUT/DELETE/PATCH from HTML forms
spring.mvc.hiddenmethod.filter.enabled=true
