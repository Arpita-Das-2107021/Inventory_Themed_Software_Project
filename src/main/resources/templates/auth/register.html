<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Register Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; min-height: 100vh; }
        .register-card { max-width: 480px; width: 100%; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center py-4">
    <div class="register-card">
        <div class="text-center mb-4">
            <i class="bi bi-boxes fs-1 text-dark"></i>
            <h2 class="mt-2 fw-bold">Create Account</h2>
            <p class="text-muted">Join the Inventory Management System</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" id="username" th:field="*{username}"
                               class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                               placeholder="Enter username"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}"
                             th:errors="*{username}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                               placeholder="Enter email"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}"
                             th:errors="*{email}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" th:field="*{password}"
                               class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                               placeholder="Minimum 6 characters"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}"
                             th:errors="*{password}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                               placeholder="Re-enter password"/>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}"
                             th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">
                            <i class="bi bi-person-plus me-2"></i>Register
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-muted">
            Already have an account?
            <a href="/auth/login" class="text-dark fw-semibold">Sign in</a>
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
