<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Login Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { background-color: #f0f2f5; display: flex; align-items: center; min-height: 100vh; }
        .login-card { max-width: 420px; width: 100%; }
    </style>
</head>
<body>
<div class="container d-flex justify-content-center">
    <div class="login-card">
        <div class="text-center mb-4">
            <i class="bi bi-boxes fs-1 text-dark"></i>
            <h2 class="mt-2 fw-bold">Inventory Management</h2>
            <p class="text-muted">Sign in to your account</p>
        </div>
        <div class="card shadow-sm">
            <div class="card-body p-4">

                <div th:if="${param.error}" class="alert alert-danger">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Invalid email or password.
                </div>
                <div th:if="${param.logout}" class="alert alert-info">
                    <i class="bi bi-info-circle me-2"></i>
                    You have been logged out.
                </div>
                <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

                <form th:action="@{/auth/login}" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="Enter email" required autofocus/>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Enter password" required/>
                    </div>
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <p class="text-center mt-3 text-muted">
            Don't have an account?
            <a href="/auth/register" class="text-dark fw-semibold">Register here</a>
        </p>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
