<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Inventory Report Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
        .low-stock-row { background-color: #fff3cd !important; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('reports')}"></nav>

<div class="container-fluid px-4 py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-clipboard-data me-2"></i>Inventory Report</h1>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Product</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Threshold</th>
                        <th>Status</th>
                        <th>Created</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="product : ${products}" th:classappend="${product.lowStock} ? 'low-stock-row'">
                        <td th:text="${product.id}"></td>
                        <td class="fw-semibold" th:text="${product.name}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"></td>
                        <td>
                            <span th:text="${product.stockQuantity}"
                                  th:classappend="${product.lowStock} ? 'badge bg-danger' : 'badge bg-success'"></span>
                        </td>
                        <td th:text="${product.lowStockThreshold}"></td>
                        <td>
                            <span th:if="${product.lowStock}" class="badge bg-warning text-dark">
                                <i class="bi bi-exclamation-triangle me-1"></i>Low Stock
                            </span>
                            <span th:unless="${product.lowStock}" class="badge bg-success">OK</span>
                        </td>
                        <td th:text="${#temporals.format(product.createdAt, 'dd MMM yyyy')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-center text-muted py-4">No products found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
