<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Sales Report Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('reports')}"></nav>

<div class="container-fluid px-4 py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-graph-up me-2"></i>Sales Report</h1>

    <!-- Date Filter -->
    <div class="card mb-4">
        <div class="card-body">
            <form method="get" th:action="@{/reports/sales}" class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-semibold">From Date</label>
                    <input type="date" name="from" class="form-control" th:value="${from}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold">To Date</label>
                    <input type="date" name="to" class="form-control" th:value="${to}"/>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">
                        <i class="bi bi-funnel me-1"></i>Filter
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Summary -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <div class="text-muted small">Total Sales in Period</div>
                    <div class="fs-3 fw-bold" th:text="${#lists.size(sales)}">0</div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-center">
                <div class="card-body">
                    <div class="text-muted small">Total Revenue</div>
                    <div class="fs-3 fw-bold text-success"
                         th:text="'$' + ${#numbers.formatDecimal(totalRevenue, 1, 2)}">$0.00</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Sale #</th>
                        <th>Seller</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="sale : ${sales}">
                        <td class="fw-semibold" th:text="'#' + ${sale.id}"></td>
                        <td th:text="${sale.seller.username}"></td>
                        <td th:text="${#lists.size(sale.saleItems)}"></td>
                        <td th:text="'$' + ${#numbers.formatDecimal(sale.totalAmount, 1, 2)}"></td>
                        <td th:text="${#temporals.format(sale.createdAt, 'dd MMM yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/sales/{id}(id=${sale.id})}" class="btn btn-sm btn-outline-primary">View</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(sales)}">
                        <td colspan="6" class="text-center text-muted py-4">No sales in selected period.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
