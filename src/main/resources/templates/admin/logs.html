<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Audit Logs Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container-fluid px-4 py-4">
    <h1 class="h3 fw-bold mb-4"><i class="bi bi-journal-text me-2"></i>Audit Logs</h1>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>User</th>
                        <th>Action</th>
                        <th>Entity</th>
                        <th>ID</th>
                        <th>Details</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td th:text="${log.id}"></td>
                        <td class="small" th:text="${log.userEmail}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${log.action == 'DELETE'} ? 'bg-danger' : (${log.action == 'CREATE'} ? 'bg-success' : 'bg-primary')"
                                  th:text="${log.action}"></span>
                        </td>
                        <td class="small fw-semibold" th:text="${log.entityType}"></td>
                        <td class="small text-muted" th:text="${log.entityId}"></td>
                        <td class="small text-muted" th:text="${log.details}"></td>
                        <td class="small text-muted" th:text="${#temporals.format(log.createdAt, 'MMM d, yyyy HH:mm')}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(logs)}">
                        <td colspan="7" class="text-center text-muted py-4">No audit logs found.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
