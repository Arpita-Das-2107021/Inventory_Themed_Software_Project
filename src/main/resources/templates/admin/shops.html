<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Shops â€” Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container-fluid px-4 py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-shop me-2"></i>Shops</h1>
        <a href="/shops/new" class="btn btn-dark btn-sm" sec:authorize="hasRole('ORGANIZATION_ADMIN')">
            <i class="bi bi-plus-lg me-1"></i>New Shop
        </a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>#</th>
                        <th>Name</th>
                        <th>Organization</th>
                        <th>Manager</th>
                        <th>Created</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="shop : ${shops}">
                        <td th:text="${shop.id}"></td>
                        <td class="fw-semibold" th:text="${shop.name}"></td>
                        <td class="text-muted small" th:text="${shop.organization != null ? shop.organization.name : 'â€”'}"></td>
                        <td class="small">
                            <span th:if="${shop.manager != null}" th:text="${shop.manager.username}" class="badge bg-primary"></span>
                            <span th:unless="${shop.manager != null}" class="badge bg-secondary">Unassigned</span>
                        </td>
                        <td class="small text-muted" th:text="${shop.createdAt != null ? #temporals.format(shop.createdAt, 'MMM d, yyyy') : 'â€”'}"></td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a th:href="@{/shops/{id}/edit(id=${shop.id})}" class="btn btn-outline-primary" title="Edit / Assign Manager">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <a th:href="@{/shops/{id}/employees(id=${shop.id})}" class="btn btn-outline-info" title="View Employees">
                                    <i class="bi bi-people"></i>
                                </a>
                                <form th:id="'del-shop-' + ${shop.id}" th:action="@{/shops/{id}/delete(id=${shop.id})}" method="post" style="display:inline;" sec:authorize="hasRole('ORGANIZATION_ADMIN')">
                                    <button type="button" class="btn btn-outline-danger" title="Delete"
                                            th:attr="data-form-id='del-shop-' + ${shop.id},data-item-name=${shop.name}"
                                            onclick="confirmDelete(this)">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(shops)}">
                        <td colspan="6" class="text-center text-muted py-4">No shops found. Create one above.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
function confirmDelete(button) {
    const formId = button.dataset.formId;
    const itemName = button.dataset.itemName;
    Swal.fire({
        title: 'Delete "' + itemName + '"?',
        text: 'This action cannot be undone.',
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#dc3545',
        cancelButtonColor: '#6c757d',
        confirmButtonText: 'Yes, delete it!'
    }).then((result) => { if (result.isConfirmed) { document.getElementById(formId).submit(); } });
}
</script>
</body>
</html>
