<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${shop.name} + ' Employees Inventory'">Shop Employees Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container py-4">
    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
        <div class="d-flex align-items-center">
            <a th:href="@{/shops/{id}/edit(id=${shop.id})}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="bi bi-arrow-left"></i>
            </a>
            <div>
                <h1 class="h4 fw-bold mb-0">
                    <i class="bi bi-people me-2"></i>Employees — <span th:text="${shop.name}">Shop</span>
                </h1>
                <small class="text-muted" th:if="${shop.organization != null}">
                    <i class="bi bi-building me-1"></i><span th:text="${shop.organization.name}">Org</span>
                </small>
            </div>
        </div>
        <a th:href="@{/shops/{id}/edit(id=${shop.id})}" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-person-plus me-1"></i>Add Employee
        </a>
    </div>

    <!-- Flash messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Employee table -->
    <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h5 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i>Employee List</h5>
            <span class="badge bg-secondary" th:text="${#lists.size(employees)} + ' employee(s)'">0 employees</span>
        </div>
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(employees)}" class="text-center text-muted py-5">
                <i class="bi bi-person-x fs-1 d-block mb-2"></i>
                No employees assigned to this shop yet.
                <div class="mt-3">
                    <a th:href="@{/shops/{id}/edit(id=${shop.id})}" class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-person-plus me-1"></i>Assign an Employee
                    </a>
                </div>
            </div>
            <div th:if="${!#lists.isEmpty(employees)}" class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                        <tr>
                            <th>#</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Assigned At</th>
                            <th sec:authorize="hasRole('ORGANIZATION_ADMIN')" class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="emp, stat : ${employees}">
                            <td class="text-muted" th:text="${stat.count}">1</td>
                            <td>
                                <i class="bi bi-person-circle me-1 text-muted"></i>
                                <span th:text="${emp.user.username}">username</span>
                            </td>
                            <td class="text-muted" th:text="${emp.user.email}">email@example.com</td>
                            <td class="text-muted">
                                <span th:if="${emp.assignedAt != null}"
                                      th:text="${#temporals.format(emp.assignedAt, 'dd MMM yyyy HH:mm')}">date</span>
                                <span th:if="${emp.assignedAt == null}" class="text-secondary">—</span>
                            </td>
                            <td sec:authorize="hasRole('ORGANIZATION_ADMIN')" class="text-end">
                                <form th:action="@{/shops/{shopId}/remove-employee/{empId}(shopId=${shop.id}, empId=${emp.id})}"
                                      method="post" class="d-inline">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Remove this employee from the shop?')">
                                        <i class="bi bi-person-dash"></i> Remove
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
