<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${organization.id != null ? 'Edit Organization' : 'New Organization'} + ' — Inventory'">Organization — Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container py-4" style="max-width: 520px;">
    <div class="d-flex align-items-center mb-4">
        <a href="/organizations" class="btn btn-sm btn-outline-secondary me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="h4 fw-bold mb-0">
            <i class="bi bi-diagram-3 me-2"></i>
            <span th:text="${organization.id != null ? 'Edit Organization' : 'New Organization'}">Organization</span>
        </h1>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <form th:action="${organization.id != null ? '/organizations/' + organization.id + '/edit' : '/organizations'}"
                  method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Organization Name</label>
                    <input type="text" name="name" class="form-control"
                           th:value="${organization.name}"
                           placeholder="e.g. Acme Corp" required/>
                </div>
                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${organization.id != null ? 'Save Changes' : 'Create Organization'}">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
