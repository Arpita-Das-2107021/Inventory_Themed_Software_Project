<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Edit User Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container py-4" style="max-width: 640px;">
    <div class="d-flex align-items-center mb-4">
        <a href="/admin/users" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Back
        </a>
        <h1 class="h3 fw-bold mb-0">Edit User</h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Edit username / role -->
    <div class="card shadow-sm mb-4">
        <div class="card-header"><h5 class="mb-0">Account Details</h5></div>
        <div class="card-body">
            <form th:action="@{/admin/users/{id}/edit(id=${editUser.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control"
                           th:value="${editUser.username}" required/>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" class="form-control" th:value="${editUser.email}" disabled/>
                    <div class="form-text">Email cannot be changed.</div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="roleName" class="form-select">
                        <option value="ROLE_EMPLOYEE" th:selected="${#sets.contains(editUser.roles.![name], 'ROLE_EMPLOYEE')}">Employee (Seller)</option>
                        <option value="ROLE_SHOP_MANAGER" th:selected="${#sets.contains(editUser.roles.![name], 'ROLE_SHOP_MANAGER')}">Shop Manager</option>
                        <option value="ROLE_ORGANIZATION_ADMIN" th:selected="${#sets.contains(editUser.roles.![name], 'ROLE_ORGANIZATION_ADMIN')}">Organization Admin</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-dark">
                    <i class="bi bi-check-lg me-1"></i>Save Changes
                </button>
            </form>
        </div>
    </div>

    <!-- Reset password -->
    <div class="card shadow-sm">
        <div class="card-header"><h5 class="mb-0">Reset Password</h5></div>
        <div class="card-body">
            <form th:action="@{/admin/users/{id}/reset-password(id=${editUser.id})}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <input type="password" name="newPassword" class="form-control"
                           placeholder="Minimum 6 characters" minlength="6" required/>
                </div>
                <button type="submit" class="btn btn-warning">
                    <i class="bi bi-key me-1"></i>Reset Password
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
