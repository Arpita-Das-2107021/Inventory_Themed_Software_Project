<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${shop.id != null ? 'Edit Shop' : 'New Shop'} + ' â€” Inventory'">Shop â€” Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { padding-top: 56px; background-color: #f8f9fa; }
        .navbar-brand { font-weight: 700; }
    </style>
</head>
<body>
<nav th:replace="~{fragments/nav :: appNavbar('management')}"></nav>

<div class="container py-4" style="max-width: 640px;">
    <div class="d-flex align-items-center mb-4">
        <a href="/shops" class="btn btn-sm btn-outline-secondary me-3">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h1 class="h4 fw-bold mb-0">
            <i class="bi bi-shop me-2"></i>
            <span th:text="${shop.id != null ? 'Edit Shop' : 'New Shop'}">Shop</span>
        </h1>
    </div>

    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

    <!-- Shop Details Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header"><h5 class="mb-0">Shop Details</h5></div>
        <div class="card-body p-4">
            <form th:action="${shop.id != null ? '/shops/' + shop.id + '/edit' : '/shops'}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Shop Name</label>
                    <input type="text" name="name" class="form-control"
                           th:value="${shop.name}" placeholder="e.g. Downtown Branch" required/>
                </div>
                <div class="d-grid mt-3">
                    <button type="submit" class="btn btn-dark">
                        <i class="bi bi-check-lg me-1"></i>
                        <span th:text="${shop.id != null ? 'Save Changes' : 'Create Shop'}">Save</span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assign Manager (edit mode only) -->
    <div class="card shadow-sm mb-4" th:if="${shop.id != null}" sec:authorize="hasRole('ORGANIZATION_ADMIN')">
        <div class="card-header"><h5 class="mb-0"><i class="bi bi-person-badge me-2"></i>Assign Manager</h5></div>
        <div class="card-body p-4">
            <p class="text-muted small mb-3">
                Current manager:
                <strong th:text="${shop.manager != null ? shop.manager.username : 'None'}">None</strong>
            </p>
            <form th:action="@{/shops/{shopId}/assign-manager/{userId}(shopId=${shop.id}, userId=0)}"
                  method="post" id="assignManagerForm">
                <input type="hidden" name="_shopId" th:value="${shop.id}"/>
                <div class="input-group">
                    <select class="form-select" id="managerSelect">
                        <option value="">Select a userâ€¦</option>
                        <option th:each="u : ${users}"
                                th:value="${u.id}"
                                th:text="${u.username + ' (' + u.email + ')'}"></option>
                    </select>
                    <button type="button" class="btn btn-primary" onclick="submitAssignManager()">
                        <i class="bi bi-person-check me-1"></i>Assign
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Assign Employee (edit mode only) -->
    <div class="card shadow-sm" th:if="${shop.id != null}">
        <div class="card-header"><h5 class="mb-0"><i class="bi bi-person-plus me-2"></i>Add Employee to Shop</h5></div>
        <div class="card-body p-4">
            <form th:action="@{/shops/{shopId}/assign-employee/{userId}(shopId=${shop.id}, userId=0)}"
                  method="post" id="assignEmployeeForm">
                <input type="hidden" name="_shopId" th:value="${shop.id}"/>
                <div class="input-group">
                    <select class="form-select" id="employeeSelect">
                        <option value="">Select a userâ€¦</option>
                        <option th:each="u : ${users}"
                                th:value="${u.id}"
                                th:text="${u.username + ' (' + u.email + ')'}"></option>
                    </select>
                    <button type="button" class="btn btn-success" onclick="submitAssignEmployee()">
                        <i class="bi bi-person-plus me-1"></i>Add Employee
                    </button>
                </div>
            </form>
            <div class="mt-2">
                <a th:href="@{/shops/{id}/employees(id=${shop.id})}" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-people me-1"></i>View All Employees
                </a>
            </div>
        </div>
    </div>
    <!-- Store shop ID for JS -->
    <span id="shopIdValue" th:attr="data-id=${shop.id}" style="display:none"></span>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
function submitAssignManager() {
    var userId = document.getElementById('managerSelect').value;
    if (!userId) { alert('Please select a user.'); return; }
    var shopId = document.getElementById('shopIdValue').dataset.id;
    var form = document.getElementById('assignManagerForm');
    form.action = '/shops/' + shopId + '/assign-manager/' + userId;
    form.submit();
}
function submitAssignEmployee() {
    var userId = document.getElementById('employeeSelect').value;
    if (!userId) { alert('Please select a user.'); return; }
    var shopId = document.getElementById('shopIdValue').dataset.id;
    var form = document.getElementById('assignEmployeeForm');
    form.action = '/shops/' + shopId + '/assign-employee/' + userId;
    form.submit();
}
</script>
</body>
</html>
