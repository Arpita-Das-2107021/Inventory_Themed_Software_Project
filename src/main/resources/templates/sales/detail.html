<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title th:text="'Sale #' + ${sale.id} + ' — Inventory'">Sale Detail</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 56px;
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-weight: 700;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <nav th:replace="~{fragments/nav :: appNavbar('sales')}"></nav>

    <div class="container py-4" style="max-width: 700px">
      <div
        class="d-flex align-items-center justify-content-between mb-4 no-print"
      >
        <div class="d-flex align-items-center">
          <a href="/sales" class="btn btn-outline-secondary btn-sm me-3">
            <i class="bi bi-arrow-left"></i> Back
          </a>
          <h1 class="h3 fw-bold mb-0">Invoice</h1>
        </div>
        <button
          class="btn btn-outline-secondary btn-sm"
          onclick="window.print()"
        >
          <i class="bi bi-printer me-1"></i>Print
        </button>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <!-- Invoice Header -->
          <div class="d-flex justify-content-between align-items-start mb-4">
            <div>
              <h4 class="fw-bold mb-1">INVOICE</h4>
              <div class="text-muted small">Inventory Management System</div>
            </div>
            <div class="text-end">
              <div
                class="fs-5 fw-bold text-dark"
                th:text="'Sale #' + ${sale.id}"
              ></div>
              <div
                class="text-muted small"
                th:text="${#temporals.format(sale.createdAt, 'dd MMMM yyyy, HH:mm')}"
              ></div>
            </div>
          </div>

          <hr />

          <!-- Seller Info -->
          <div class="row mb-4">
            <div class="col">
              <div class="text-muted small text-uppercase fw-semibold mb-1">
                Sold By
              </div>
              <div class="fw-semibold" th:text="${sale.seller.username}"></div>
              <div
                class="text-muted small"
                th:text="${sale.seller.email}"
              ></div>
            </div>
            <div class="col text-md-end mt-3 mt-md-0">
              <div class="text-muted small text-uppercase fw-semibold mb-1">
                Buyer
              </div>
              <div class="fw-semibold" th:text="${sale.buyerName}"></div>
            </div>
          </div>

          <!-- Items Table -->
          <div class="table-responsive">
            <table class="table align-middle">
              <thead class="table-light">
                <tr>
                  <th>Product</th>
                  <th class="text-center">Qty</th>
                  <th class="text-end">Unit Price</th>
                  <th class="text-end">Subtotal</th>
                </tr>
              </thead>
              <tbody>
                <tr th:each="item : ${sale.saleItems}">
                  <td class="fw-semibold" th:text="${item.product.name}"></td>
                  <td class="text-center" th:text="${item.quantity}"></td>
                  <td
                    class="text-end"
                    th:text="'$' + ${#numbers.formatDecimal(item.price, 1, 2)}"
                  ></td>
                  <td
                    class="text-end fw-bold"
                    th:text="'$' + ${#numbers.formatDecimal(item.subtotal, 1, 2)}"
                  ></td>
                </tr>
              </tbody>
              <tfoot>
                <tr class="table-light">
                  <td colspan="3" class="text-end fw-bold fs-5">Total</td>
                  <td
                    class="text-end fw-bold fs-5 text-success"
                    th:text="'$' + ${#numbers.formatDecimal(sale.totalAmount, 1, 2)}"
                  ></td>
                </tr>
              </tfoot>
            </table>
          </div>

          <hr />
          <div class="text-center text-muted small">
            Thank you for your business!
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
