<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sales Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 56px;
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <nav th:replace="~{fragments/nav :: appNavbar('sales')}"></nav>

    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h3 fw-bold mb-0"><i class="bi bi-cart3 me-2"></i>Sales</h1>
        <a
          href="/sales/new"
          class="btn btn-dark"
          sec:authorize="hasRole('SHOP_MANAGER')"
        >
          <i class="bi bi-plus-lg me-1"></i>New Sale
        </a>
      </div>

      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
      >
        <span th:text="${successMessage}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>Sale #</th>
                <th>Buyer</th>
                <th>Seller</th>
                <th>Items</th>
                <th>Total Amount</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="sale : ${sales}">
                <td class="fw-semibold" th:text="'#' + ${sale.id}"></td>
                <td th:text="${sale.buyerName}"></td>
                <td th:text="${sale.seller.username}"></td>
                <td th:text="${#lists.size(sale.saleItems)}"></td>
                <td
                  class="fw-bold"
                  th:text="'$' + ${#numbers.formatDecimal(sale.totalAmount, 1, 2)}"
                ></td>
                <td
                  th:text="${#temporals.format(sale.createdAt, 'dd MMM yyyy HH:mm')}"
                ></td>
                <td>
                  <a
                    th:href="@{/sales/{id}(id=${sale.id})}"
                    class="btn btn-sm btn-outline-primary"
                  >
                    <i class="bi bi-eye me-1"></i>View
                  </a>
                  <a
                    th:href="@{/sales/{id}/invoice(id=${sale.id})}"
                    class="btn btn-sm btn-outline-dark ms-1"
                  >
                    <i class="bi bi-receipt me-1"></i>Invoice
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(sales)}">
                <td colspan="7" class="text-center text-muted py-4">
                  No sales recorded yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
