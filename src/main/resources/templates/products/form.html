<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title
      th:text="${product.id != null ? 'Edit Product' : 'New Product'} + ' — Inventory'"
    >
      Product Form — Inventory
    </title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 56px;
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <nav th:replace="~{fragments/nav :: appNavbar('products')}"></nav>

    <div class="container py-4" style="max-width: 680px">
      <div class="d-flex align-items-center mb-4">
        <a href="/products" class="btn btn-outline-secondary btn-sm me-3">
          <i class="bi bi-arrow-left"></i> Back
        </a>
        <h1
          class="h3 fw-bold mb-0"
          th:text="${product.id != null ? 'Edit Product' : 'New Product'}"
        >
          Product Form
        </h1>
      </div>

      <div class="card shadow-sm">
        <div class="card-body p-4">
          <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
            <span th:text="${errorMessage}"></span>
          </div>
          <form
            th:action="${formAction}"
            th:object="${product}"
            method="post"
            novalidate
          >
            <input
              th:if="${formMethod == 'put'}"
              type="hidden"
              name="_method"
              value="PUT"
            />

            <div class="mb-3">
              <label for="name" class="form-label fw-semibold"
                >Product Name <span class="text-danger">*</span></label
              >
              <input
                type="text"
                id="name"
                th:field="*{name}"
                class="form-control"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                placeholder="e.g. Wireless Mouse"
              />
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('name')}"
                th:errors="*{name}"
              ></div>
            </div>

            <div class="mb-3">
              <label for="description" class="form-label fw-semibold"
                >Description</label
              >
              <textarea
                id="description"
                th:field="*{description}"
                class="form-control"
                rows="3"
                placeholder="Optional product description"
              ></textarea>
            </div>

            <div class="row g-3 mb-3">
              <div class="col-md-12" th:if="${isOwner}">
                <label for="shopId" class="form-label fw-semibold"
                  >Shop <span class="text-danger">*</span></label
                >
                <select id="shopId" name="shopId" class="form-select" required>
                  <option value="">-- Select Shop --</option>
                  <option
                    th:each="shop : ${shops}"
                    th:value="${shop.id}"
                    th:text="${shop.name}"
                    th:selected="${selectedShopId != null and selectedShopId == shop.id}"
                  ></option>
                </select>
                <div class="form-text">
                  Organization admins must assign each product to a shop.
                </div>
              </div>
              <div class="col-md-12" th:if="${!isOwner}">
                <label class="form-label fw-semibold">Shop</label>
                <input
                  type="text"
                  class="form-control"
                  th:value="${actorShop != null ? actorShop.name : 'Not Assigned'}"
                  disabled
                />
              </div>
              <div class="col-md-6">
                <label for="categoryId" class="form-label fw-semibold"
                  >Category</label
                >
                <select id="categoryId" name="categoryId" class="form-select">
                  <option value="">-- No Category --</option>
                  <option
                    th:each="cat : ${categories}"
                    th:value="${cat.id}"
                    th:text="${cat.name}"
                    th:selected="${product.category != null and product.category.id == cat.id}"
                  ></option>
                </select>
              </div>
            </div>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="price" class="form-label fw-semibold"
                  >Price ($) <span class="text-danger">*</span></label
                >
                <input
                  type="number"
                  id="price"
                  th:field="*{price}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'"
                  step="0.01"
                  min="0"
                  placeholder="0.00"
                />
                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('price')}"
                  th:errors="*{price}"
                ></div>
              </div>
              <div class="col-md-6">
                <label for="stockQuantity" class="form-label fw-semibold"
                  >Initial Stock <span class="text-danger">*</span></label
                >
                <input
                  type="number"
                  id="stockQuantity"
                  th:field="*{stockQuantity}"
                  class="form-control"
                  th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid'"
                  min="0"
                  placeholder="0"
                />
                <div
                  class="invalid-feedback"
                  th:if="${#fields.hasErrors('stockQuantity')}"
                  th:errors="*{stockQuantity}"
                ></div>
              </div>
            </div>

            <div class="mb-3 mt-3">
              <label for="lowStockThreshold" class="form-label fw-semibold"
                >Low Stock Threshold <span class="text-danger">*</span></label
              >
              <input
                type="number"
                id="lowStockThreshold"
                th:field="*{lowStockThreshold}"
                class="form-control"
                th:classappend="${#fields.hasErrors('lowStockThreshold')} ? 'is-invalid'"
                min="1"
                placeholder="e.g. 10"
              />
              <div class="form-text">
                Alert triggers when stock falls below this number.
              </div>
              <div
                class="invalid-feedback"
                th:if="${#fields.hasErrors('lowStockThreshold')}"
                th:errors="*{lowStockThreshold}"
              ></div>
            </div>

            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-dark">
                <i class="bi bi-check-lg me-1"></i>
                <span
                  th:text="${product.id != null ? 'Save Changes' : 'Create Product'}"
                  >Save</span
                >
              </button>
              <a href="/products" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
