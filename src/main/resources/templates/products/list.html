<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products — Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        padding-top: 56px;
        background-color: #f8f9fa;
      }
      .navbar-brand {
        font-weight: 700;
      }
      .low-stock-row {
        background-color: #fff3cd !important;
      }
    </style>
  </head>
  <body>
    <nav th:replace="~{fragments/nav :: appNavbar('products')}"></nav>

    <div class="container-fluid px-4 py-4">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 fw-bold mb-0">
          <i class="bi bi-box-seam me-2"></i>Products
        </h1>
        <a
          href="/products/new"
          class="btn btn-dark"
          sec:authorize="hasAnyRole('SHOP_MANAGER','ORGANIZATION_ADMIN')"
        >
          <i class="bi bi-plus-lg me-1"></i>Add Product
        </a>
      </div>
      <div class="text-muted small mb-2">
        Products are sorted by shop, then by product name.
      </div>

      <form method="get" action="/products" class="mb-3">
        <div class="input-group" style="max-width: 400px">
          <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search products…"
            th:value="${search}"
          />
          <button class="btn btn-outline-secondary" type="submit">
            <i class="bi bi-search"></i>
          </button>
          <a
            href="/products"
            class="btn btn-outline-secondary"
            th:if="${search != null and !#strings.isEmpty(search)}"
            ><i class="bi bi-x"></i
          ></a>
        </div>
      </form>

      <div
        th:if="${successMessage}"
        class="alert alert-success alert-dismissible fade show"
      >
        <span th:text="${successMessage}"></span>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
        ></button>
      </div>

      <div class="card">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th>#</th>
                <th>Name</th>
                <th>Shop</th>
                <th>Category</th>
                <th>Description</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Threshold</th>
                <th>Status</th>
                <th
                  sec:authorize="hasAnyRole('SHOP_MANAGER','ORGANIZATION_ADMIN')"
                >
                  Actions
                </th>
                <th sec:authorize="hasRole('SHOP_MANAGER')">Sell</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="product : ${products}"
                th:classappend="${product.lowStock} ? 'low-stock-row'"
              >
                <td th:text="${product.id}"></td>
                <td class="fw-semibold" th:text="${product.name}"></td>
                <td
                  class="text-muted small"
                  th:text="${product.shop != null ? product.shop.name : '—'}"
                ></td>
                <td
                  class="text-muted small"
                  th:text="${product.category != null ? product.category.name : '—'}"
                ></td>
                <td
                  class="text-muted small"
                  th:text="${product.description}"
                ></td>
                <td
                  th:text="'$' + ${#numbers.formatDecimal(product.price, 1, 2)}"
                ></td>
                <td>
                  <span
                    th:text="${product.stockQuantity}"
                    th:class="${product.lowStock} ? 'badge bg-danger' : 'badge bg-success'"
                  ></span>
                </td>
                <td th:text="${product.lowStockThreshold}"></td>
                <td>
                  <span th:if="${!product.active}" class="badge bg-secondary"
                    >Inactive</span
                  >
                  <span
                    th:if="${product.active and product.lowStock}"
                    class="badge bg-warning text-dark"
                  >
                    <i class="bi bi-exclamation-triangle me-1"></i>Low Stock
                  </span>
                  <span
                    th:if="${product.active and !product.lowStock}"
                    class="badge bg-success"
                    >OK</span
                  >
                </td>
                <td
                  sec:authorize="hasAnyRole('SHOP_MANAGER','ORGANIZATION_ADMIN')"
                >
                  <div class="btn-group btn-group-sm">
                    <a
                      th:href="@{/products/{id}/edit(id=${product.id})}"
                      class="btn btn-outline-primary"
                      title="Edit"
                    >
                      <i class="bi bi-pencil"></i>
                    </a>
                    <a
                      th:href="@{/products/{id}/stock(id=${product.id})}"
                      class="btn btn-outline-warning"
                      title="Adjust Stock"
                    >
                      <i class="bi bi-arrow-left-right"></i>
                    </a>
                    <form
                      th:id="'del-' + ${product.id}"
                      th:action="@{/products/{id}(id=${product.id})}"
                      method="post"
                      style="display: inline"
                    >
                      <input type="hidden" name="_method" value="DELETE" />
                      <button
                        type="button"
                        class="btn btn-outline-danger"
                        title="Delete"
                        th:attr="data-form-id='del-' + ${product.id},data-item-name=${product.name}"
                        onclick="confirmDelete(this)"
                      >
                        <i class="bi bi-trash"></i>
                      </button>
                    </form>
                  </div>
                </td>
                <td sec:authorize="hasRole('SHOP_MANAGER')">
                  <a
                    th:href="@{/sales/new(productId=${product.id})}"
                    class="btn btn-outline-success btn-sm"
                    title="Sell"
                  >
                    <i class="bi bi-cart-plus"></i>
                  </a>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="11" class="text-center text-muted py-4">
                  No products found.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      function confirmDelete(button) {
        const formId = button.dataset.formId;
        const itemName = button.dataset.itemName;
        Swal.fire({
          title: 'Delete "' + itemName + '"?',
          text: "This action cannot be undone.",
          icon: "warning",
          showCancelButton: true,
          confirmButtonColor: "#dc3545",
          cancelButtonColor: "#6c757d",
          confirmButtonText: "Yes, delete it!",
          cancelButtonText: "Cancel",
        }).then((result) => {
          if (result.isConfirmed) {
            document.getElementById(formId).submit();
          }
        });
      }
    </script>
  </body>
</html>
