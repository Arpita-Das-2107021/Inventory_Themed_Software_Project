<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Error Inventory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet"/>
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8f9fa; }
    </style>
</head>
<body>
<div class="text-center" style="max-width: 480px; padding: 2rem;">
    <div class="display-1 fw-bold text-danger" th:text="${errorCode ?: 'Error'}"></div>
    <h2 class="mt-2 mb-3">Something went wrong</h2>
    <p class="text-muted" th:text="${errorMessage ?: 'An unexpected error occurred.'}"></p>
    <a href="/dashboard" class="btn btn-dark mt-3">
        <i class="bi bi-house me-1"></i>Go to Dashboard
    </a>
</div>
</body>
</html>
