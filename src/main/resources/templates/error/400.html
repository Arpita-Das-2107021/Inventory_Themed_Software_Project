<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bad Request - Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: radial-gradient(circle at top left, #f8f9ff 0%, #eef3f7 45%, #ffffff 100%);
      }
      .error-card {
        max-width: 540px;
        width: calc(100% - 2rem);
      }
    </style>
  </head>
  <body>
    <div class="card shadow-sm error-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="display-4 fw-bold text-warning">400</div>
        <h1 class="h3 mt-2">Bad Request</h1>
        <p class="text-muted mb-4" th:text="${message ?: 'Your request could not be processed.'}">
          Your request could not be processed.
        </p>
        <a class="btn btn-dark" href="/dashboard">
          <i class="bi bi-house-door me-1"></i>Back to Dashboard
        </a>
      </div>
    </div>
  </body>
</html>
