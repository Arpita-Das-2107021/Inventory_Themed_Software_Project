<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forbidden - Inventory</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: radial-gradient(circle at top left, #fff7f5 0%, #fcebe6 45%, #ffffff 100%);
      }
      .error-card {
        max-width: 560px;
        width: calc(100% - 2rem);
      }
    </style>
  </head>
  <body>
    <div class="card shadow-sm error-card">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="display-4 fw-bold text-danger">403</div>
        <h1 class="h3 mt-2">Access Forbidden</h1>
        <p class="text-muted mb-4" th:text="${message ?: 'You do not have permission to access this resource.'}">
          You do not have permission to access this resource.
        </p>
        <div class="d-flex justify-content-center gap-2 flex-wrap">
          <a class="btn btn-dark" href="/dashboard">
            <i class="bi bi-house-door me-1"></i>Back to Dashboard
          </a>
          <a class="btn btn-outline-secondary" href="/auth/login">
            <i class="bi bi-person-circle me-1"></i>Switch Account
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
